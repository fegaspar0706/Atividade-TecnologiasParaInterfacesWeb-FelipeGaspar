<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uhub - Cadastro</title>

    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-page">

<header class="app-header">
        <a href="index.html" class="logo" title="Voltar para Uhub">Uhub</a>
    </header>

    <header class="top-bar">
        <a class="back-light" href="index.html" title="Voltar para login">←</a>
    </header>

    <main class="center-page">
        <section class="register-card">
            <form action="personalizar-perfil.html" class="js-password-match-form" novalidate>
                <h1>Cadastro</h1>

                <input class="input" type="text" name="nome" placeholder="Nome completo" required aria-label="Nome completo">
                <input class="input" type="text" name="cpf" placeholder="CPF" required aria-label="CPF">

                <fieldset>
                    <legend>Gênero</legend>
                    <div class="radio-row">
                        <label><input type="radio" name="sexo" value="Masculino"> Masculino</label>
                        <label><input type="radio" name="sexo" value="Feminino"> Feminino</label>
                        <label><input type="radio" name="sexo" value="Outro"> Outro</label>
                    </div>
                </fieldset>

                <legend>Nascimento</legend>
                <div class="birth-row">
                    <input class="date-input" type="number" placeholder="DD" min="1" max="31" required>
                    <input class="date-input" type="number" placeholder="MM" min="1" max="12" required>
                    <input class="date-input year" type="number" placeholder="AAAA" min="1900" max="9999" required>
                </div>

                <legend>Email e senha</legend>
                <input class="input" type="email" name="email_pessoal" placeholder="E-mail pessoal" required>
                <input class="input" type="email" name="email_institucional" placeholder="E-mail institucional" required>
                <input class="input js-password-main" type="password" name="senha" placeholder="Senha" minlength="8" autocomplete="new-password" required>
                <input class="input js-password-confirm" type="password" name="confirmar_senha" placeholder="Confirme sua senha" minlength="8" autocomplete="new-password" required>
                <small class="password-match-message" aria-live="polite"></small>

                <button class="btn primary" type="submit">Prosseguir com cadastro</button>
                 <p><a class="back-light" href="index.html" title="Voltar para login">←</a></p>
            </form>
        </section>
    </main>

    <footer class="bottom-bar"></footer>
    <script src="script.js"></script>
</body>
</html>
