<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uhub - Personalizar Perfil</title>

    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="profile-setup-page">
        <a class="back-dark" href="cadastro.html">←</a>

        <h1>Personalizando o perfil</h1>

        <section class="setup-card">
            <label class="avatar-upload">
                <input type="file" accept="image/*">
                <span>＋</span>
            </label>

            <p>Altere sua foto de perfil (opcional)</p>

            <input class="input" type="text" placeholder="Insira seu nome de usuário">

            <label class="anonymous">
                <input type="checkbox">
                Perfil anônimo
            </label>

            <a class="btn primary" href="feed.html">Finalizar cadastro</a>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
